name: eval

# No secrets, no model, no network beyond the package index. Everything this
# workflow checks is either a property of committed files or something the
# scripted agent reproduces deterministically -- which is the reason the stub
# backend exists. A pipeline that needs an API key to verify itself cannot run
# on a fork's pull request, and cannot run at all once the key expires.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      # The corpus is committed, and it has to be reproducible from the seed or
      # the ground truth is just a file somebody edited. Regenerating over the
      # checkout is safe: the working copy is thrown away after the job.
      - name: The committed corpus is reproducible from its seed
        run: |
          mkdir -p /tmp/corpus
          cp data/sessions.json data/seeded_truth.json data/accounts.json /tmp/corpus/
          python src/generate_data.py
          for f in sessions.json seeded_truth.json accounts.json; do
            if ! diff -q "/tmp/corpus/$f" "data/$f" >/dev/null; then
              echo "::error::data/$f does not match what generate_data.py produces"
              diff "/tmp/corpus/$f" "data/$f" | head -20
              exit 1
            fi
          done
          echo "corpus reproduces byte-for-byte"

      - name: Build the database
        run: python src/store.py --init --force

      # Before the tests, not after. These two groups name their cause in one
      # line -- "harness ceiling 0/52 visible" says a stale tools.py in a way
      # that a failing async test, which surfaces as an ExceptionGroup, does
      # not. Cheap, and it turns a confusing red build into an obvious one.
      - name: Gate — integrity, structure, planning (fail fast)
        run: |
          PYTHONPATH=src python src/gate.py \
            --only integrity --only structural --only planning

      # Fast and free: ten deliberately broken supervisors over eighty requests
      # with simulated workers, asserting each still produces its own signature.
      # A routing number is only worth reporting if a broken orchestrator scores
      # badly, and this is how that stays true.
      - name: Routing scorer calibration
        run: PYTHONPATH=src python src/calibrate_routing.py

      # Each suite's full output goes in a collapsed group, but its verdict and
      # any failing test name are printed OUTSIDE the group and repeated in the
      # summary. A CI log that hides which test failed behind a fold costs more
      # than the scrolling it saves.
      # The authoritative run. The per-file loop below is kept for its readable
      # per-suite verdicts, but it executes each file as a script -- so a suite
      # with no __main__ runner exits 0 having run nothing, and CI reports green
      # over tests that never executed. That happened: two suites, a hundred and
      # twenty-three tests, silently skipped. This step collects every suite
      # whether it has a runner or not.
      - name: Tests (pytest, authoritative)
        run: python -m pytest tests/ -q --tb=short

      - name: Tests (per-suite verdicts)
        run: |
          fail=0
          summary=""
          for f in tests/test_*.py; do
            echo "::group::$f"
            out=$(python "$f" 2>&1) && rc=0 || rc=1
            echo "$out"
            echo "::endgroup::"
            line=$(echo "$out" | grep -E '^[0-9]+ tests,' | tail -1)
            if [ "$rc" -ne 0 ]; then
              fail=1
              echo "::error file=$f::$f — $line"
              echo "$out" | grep -E '^\s+(FAIL|ERROR)' | while read -r l; do
                echo "::error file=$f::$l"
              done
              summary="$summary- FAIL  \`$f\` — $line"$'\n'
            else
              echo "  ok   $f — $line"
              summary="$summary- pass  \`$f\` — $line"$'\n'
            fi
          done
          printf '## Test suites\n\n%s' "$summary" >> "$GITHUB_STEP_SUMMARY"
          exit $fail

      # The full fast gate, including the committed baselines recomputed from
      # the committed trajectories. This is the group that turns a README
      # sentence going false into a red build.
      - name: Gate — baselines and trace
        run: PYTHONPATH=src python src/gate.py --skip-calibration

      # The slow one, about 95 seconds: re-run every deliberately broken stub
      # policy and confirm the scorer still tells them apart. Asserting a
      # committed number only catches a change in that number; asserting that a
      # broken agent still scores badly catches a scorer that has stopped
      # working, which no numeric threshold can see.
      - name: Gate — scorer calibration
        run: PYTHONPATH=src python src/gate.py --only calibration

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          retention-days: 14
