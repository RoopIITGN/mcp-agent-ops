# What CI refuses to let through.
#
# Two kinds of entry, and the distinction matters. The `structural` checks are
# assertions about the shape of the system -- that no tool approves anything,
# that the reconciliation agent holds no write tool, that no schema lets a
# caller name an account. Those are not performance thresholds with a tolerable
# failure rate; they are the claims the repo makes, and any one of them failing
# means a claim in the README has become false.
#
# The numeric thresholds are deliberately set at the values the current
# scripted agent achieves, because a scripted agent is deterministic and
# anything less than perfect means something broke. They are NOT a judgement
# about what a model should achieve. When the model run lands, its numbers go
# in a separate block rather than replacing these -- a gate that moves to
# accommodate whatever the system currently does is not a gate.

severity:
  integrity: block            # the corpus and its ground truth
  structural: block           # the gates, asserted statically
  calibration: block          # can the scorer still tell good from bad
  baselines: block            # committed results, recomputed
  trace: warn                 # an artefact, not a guarantee

integrity:
  # The ceiling: what fraction of seeded discrepancies the comparison can see
  # at all. Below 1.0 the harness has an upper bound no agent can reach, and
  # every recall number becomes a measurement of the plumbing.
  harness_ceiling_min: 1.0
  # Control sessions must stay silent. A control that reports something
  # differing is no longer a control, and the false-positive rate built on it
  # is meaningless.
  controls_with_observations_max: 0

structural:
  # The whole vocabulary. Listed so that adding a tool is a deliberate act that
  # fails CI until this file is updated with it.
  expected_tools:
    - fetch_broker_statement
    - fetch_internal_ledger
    - calculate_position_deltas
    - flag_discrepancy
    - draft_client_inquiry
    - stage_for_execution
  # Substrings no tool name may contain, at any point, for any role.
  forbidden_tool_name_fragments: [approve, execute, decide, confirm, settle, release]
  # Parameters no tool may accept. account_id is the isolation gate; tolerance
  # is the number that decides whether a price variance exists, and an agent
  # able to widen it could make discrepancies disappear.
  forbidden_parameters: [account_id, tolerance]
  # The agent that reads untrusted statement text must hold no write tool.
  read_only_roles: [reconciliation]
  write_tools: [flag_discrepancy, draft_client_inquiry, stage_for_execution]

calibration:
  # Sessions per policy. Twelve covers all five discrepancy kinds plus
  # controls and runs in about ninety seconds; sixty takes eight minutes and
  # has never produced a different verdict.
  sessions: 12

baselines:
  backend: stub:ideal
  recall_min: 1.0
  precision_min: 1.0
  trajectory_clean_min: 1.0
  control_false_positives_max: 0
  schema_validity_min: 1.0

trace:
  path: reports/trace.jsonl
  orphans_max: 0
  min_tool_spans: 1
